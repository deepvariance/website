<section
  id="hero"
  class="page-hero hero-section hero-section--flow hero-section--page"
  [class.page-hero--border]="borderBottom"
>
  <app-hero-fluid-shader />
  <div class="page-hero__container">
    <div class="page-hero__copy">
      <div class="page-hero__meta mb-7">
        @if (icon && iconLabel) {
          <div class="page-hero__icon-row">
            <div class="page-hero__feature-icon">
              <lucide-icon [img]="icon" [size]="20" />
            </div>
            <span class="label-caps text-white">{{ iconLabel }}</span>
          </div>
        } @else {
          <app-status-pill [variant]="statusVariant">{{ statusLabel }}</app-status-pill>
        }
      </div>

      <div class="page-hero__title">
        <ng-content select="[heroTitle]" />
      </div>

      <div class="page-hero__subtitle">
        <ng-content select="[heroSubtitle]" />
      </div>

      @if (image) {
        <div class="page-hero__image-mobile desk:hidden" [class.page-hero__image-mobile--blend]="image.mobileBlendOpacity != null">
          <img
            [src]="image.src"
            [alt]="image.alt ?? ''"
            [attr.width]="image.width"
            [attr.height]="image.height"
            [style.opacity]="image.mobileBlendOpacity ?? 1"
            class="page-hero__image-mobile-img"
          />
        </div>
      }

      @if (kpis.length) {
        <div class="page-hero__kpis" [class.page-hero__kpis--grid]="kpis.length > 1">
          @for (kpi of kpis; track kpi.label) {
            <div class="page-hero__kpi">
              @if (kpi.qualifier) {
                <span class="page-hero__kpi-qualifier">{{ kpi.qualifier }}</span>
              }
              <span class="page-hero__kpi-value" [class.text-white]="kpi.highlight !== false">{{ kpi.value }}</span>
              <span class="page-hero__kpi-label">{{ kpi.label }}</span>
            </div>
          }
        </div>
      }

      <ng-content select="[heroActions]" />
    </div>

    @if (image?.desktopBlend) {
      <div class="page-hero__image-desk hidden desk:block" aria-hidden="true">
        <img
          [src]="image!.src"
          [alt]="image!.alt ?? ''"
          [attr.width]="image!.width"
          [attr.height]="image!.height"
          fetchpriority="high"
          class="page-hero__image-desk-img"
        />
      </div>
    }

    @if (image && !image.desktopBlend) {
      <div class="page-hero__image-desk hidden desk:block" aria-hidden="true">
        <img
          [src]="image.src"
          [alt]="image.alt ?? ''"
          [attr.width]="image.width"
          [attr.height]="image.height"
          fetchpriority="high"
          class="page-hero__image-desk-img"
        />
      </div>
    }
  </div>
</section>
